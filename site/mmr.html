<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#970018" />
    <meta name="description" content="登记科大 Dota 2 内战玩家的称呼和当前天梯 MMR。" />
    <title>玩家登记 · 科大光荣榜</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20261126-1" />
    <link rel="stylesheet" href="./matchmaker.css?v=9" />
    <link rel="stylesheet" href="./mmr.css?v=2" />
    <link rel="preconnect" href="https://408sq8skz1.execute-api.ap-northeast-1.amazonaws.com" crossorigin />
    <link rel="modulepreload" href="./matchmaker-model.js?v=11" />
    <link rel="modulepreload" href="./shared-mmr.js?v=4" />
    <link rel="preload" href="./data/league.json" as="fetch" crossorigin />
    <script>
      // Repeat visits are served from the service worker's cache (sw.js). Local servers skip it so edits show at once.
      if (!["localhost", "127.0.0.1"].includes(location.hostname)) navigator.serviceWorker?.register("./sw.js");
    </script>
    <script src="./mmr.js?v=15" type="module"></script>
  </head>
  <body class="draft-page">
    <header class="draft-header">
      <div class="draft-header-inner">
        <nav class="draft-nav" aria-label="站内导航">
          <a class="draft-back" href="./"><span aria-hidden="true">←</span> 科大光荣榜</a>
          <a class="draft-back" href="./matchmaker.html">选马工具 <span aria-hidden="true">→</span></a>
          <a class="draft-back" href="./stats.html">数据 <span aria-hidden="true">→</span></a>
        </nav>
        <h1>玩家登记</h1>
        <p>填好的称呼会显示在光荣榜各页，天梯分公开用于内战分队。所有访客都能编辑，请只更新自己的。</p>
      </div>
    </header>

    <main class="page-shell draft-shell mmr-shell">
      <form class="panel mmr-panel" id="mmrForm" novalidate>
        <div class="draft-heading mmr-heading">
          <div>
            <h2>联赛玩家</h2>
            <p class="draft-meta" id="mmrRosterStatus" role="status">正在读取联赛名单……</p>
          </div>
          <input class="mmr-input" type="search" id="mmrSearch" aria-label="搜索玩家" placeholder="搜索称呼、昵称或 Account ID" disabled />
        </div>
        <p class="draft-meta mmr-help">天梯分留空使用公开段位估分，清空已填分数并保存可恢复估分。</p>
        <p class="draft-meta mmr-help mmr-feedback is-error" id="mmrAliasNotice" hidden>共享服务还没有更新，称呼暂时不能保存。</p>

        <div class="mmr-columns" aria-hidden="true">
          <span>玩家</span>
          <span>公开段位估分</span>
          <span>称呼</span>
          <span>手填 MMR</span>
        </div>
        <div id="mmrRows"></div>
        <p class="draft-meta mmr-empty" id="mmrNoMatches" hidden>没有符合搜索条件的玩家。</p>

        <div class="mmr-actions">
          <div>
            <p class="mmr-pending" id="mmrPending" hidden></p>
            <p class="draft-meta mmr-feedback" id="mmrFeedback" role="status"></p>
          </div>
          <button class="draft-primary" id="mmrSave" type="submit" disabled>保存改动</button>
        </div>
      </form>
    </main>
  </body>
</html>
