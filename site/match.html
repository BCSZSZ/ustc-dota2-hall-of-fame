    <script>
      // The match's own files depend on the URL, so their preloads are added here.
      {
        const id = new URLSearchParams(location.search).get("id");
        if (/^\d+$/.test(id)) for (const dir of ["matches", "heat"]) {
          document.head.append(Object.assign(document.createElement("link"),
            { rel: "preload", as: "fetch", crossOrigin: "anonymous", href: `./data/${dir}/${id}.json` }));
        }
      }
    </script>
    <script>
      // Repeat visits are served from the service worker's cache (sw.js). Local servers skip it so edits show at once.
      if (!["localhost", "127.0.0.1"].includes(location.hostname)) navigator.serviceWorker?.register("./sw.js");
    </script>
