name: Refresh and deploy 科大光荣榜

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "collector.py"
      - "match_details.py"
      - "replays.py"
      - "hero_names_zh.json"
      - "mmr-api/**"
      - "requirements.txt"
      - "tests/**"
  schedule:
    # 10:00 JST every day (GitHub cron is UTC).
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full refreshes names and ranks; incremental only adds new matches"
        type: choice
        options:
          - full
          - incremental
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ustc-dota2-hall-of-fame-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Queued runs must start from the newest bot commit, not the commit that triggered them.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Run matchmaking and shared MMR tests
        run: node --experimental-default-type=module --test tests/*.mjs

      - name: Refresh OpenDota league data
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          OPENDOTA_MAX_PAID_CALLS: "250"
          # Uploads archived replays to the year's Release (contents: write).
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          if [ "$MODE" = "incremental" ]; then
            python collector.py --league-id 19224 --output site/data/league.json --refresh-recent 0 --incremental
          else
            python collector.py --league-id 19224 --output site/data/league.json --refresh-recent 5
          fi

      - name: Turn archived replays into whole-game heatmaps
        # A failed parse leaves the match on the laning-phase heatmap; the next run tries again.
        continue-on-error: true
        run: |
          if [ "$(python replays.py todo)" = "0" ]; then
            echo "Every archived replay already has a heatmap."
            exit 0
          fi
          docker run -d --name replay-parser -p 5600:5600 \
            odota/parser@sha256:e615dd38232b8ac6a47516787f7cdd6e8db10e92bd7354ea72c3b8ca7b1c987c
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5600/healthz && break
            sleep 2
          done
          python replays.py parse

      - name: Persist refreshed data
        run: |
          git add site/data site/img
          if git diff --cached --quiet; then
            echo "League data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh league dashboard data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

